<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Inventario</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Mini Inventario</h1>
    <p class="subtitulo">Día 4 · Inventario personal con Supabase</p>
    <section aria-labelledby="titulo-acceso">
      <h2 id="titulo-acceso">Tu cuenta</h2>
      <p id="sesion"></p>
      <form id="acceso-form">
        <label>Correo<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <button type="submit" value="ingreso">Iniciar sesión</button>
        <button type="submit" value="registro" class="secundario">Crear cuenta</button>
      </form>
      <button type="button" id="salir" hidden>Cerrar sesión</button>
      <p role="status" id="estado-acceso">Preparando el acceso…</p>
    </section>
    <section id="inventario" aria-labelledby="titulo-formulario" hidden>
      <h2 id="titulo-formulario">Agregar producto</h2>
      <form id="producto-form">
        <label>Producto<input name="nombre" required maxlength="100"></label>
        <label>Cantidad<input name="cantidad" type="number" min="0" max="2147483647" step="1" required></label>
        <label>Mínimo<input name="minimo" type="number" min="0" max="2147483647" step="1" required></label>
        <button type="submit">Guardar producto</button>
        <button type="button" id="cancelar" hidden>Cancelar edición</button>
      </form>
      <p role="status" id="estado"></p>
    </section>
    <section id="listado" aria-labelledby="titulo-listado" hidden>
      <h2 id="titulo-listado">Productos</h2>
      <p id="vacio">Todavía no hay productos.</p>
      <div class="tabla">
        <table hidden>
          <thead>
            <tr><th>Producto</th><th>Cantidad</th><th>Mínimo</th><th>Estado</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
